<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Company OData Query</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
        }

        .row {
            margin-bottom: 12px;
        }

        label {
            display: inline-block;
            width: 120px;
            vertical-align: top;
        }

        input, select, button {
            padding: 8px;
            margin: 4px 0;
            font-size: 14px;
        }

        input {
            width: 420px;
        }

        #filterHelp {
            display: block;
            margin-left: 124px;
        }

        #top, #skip {
            width: 120px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #999;
            padding: 8px;
            text-align: left;
        }

        #urlPreview {
            margin-top: 16px;
            padding: 10px;
            background: #f5f5f5;
            border: 1px solid #ccc;
            font-family: Consolas, monospace;
            word-break: break-all;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h2>Company OData Query</h2>

    <div class="row">
        <label for="entity">Table:</label>
        <select id="entity">
            <option value="Employees">Employees</option>
            <option value="Products">Products</option>
            <option value="Branches">Branches</option>
        </select>
    </div>

    <div class="row">
        <label for="filter">$filter:</label>
        <input id="filter" type="text" value="Salary ge 70000" />
        <small id="filterHelp">Combine conditions with and/or, not commas (e.g., Salary ge 60000 and Salary le 70000).</small>
    </div>

    <div class="row">
        <label for="select">$select:</label>
        <input id="select" type="text" value="Name,Email,Salary" />
    </div>

    <div class="row">
        <label for="orderby">$orderby:</label>
        <input id="orderby" type="text" value="Salary desc" />
    </div>

    <div class="row">
        <label for="top">$top:</label>
        <input id="top" type="number" value="5" />
    </div>

    <div class="row">
        <label for="skip">$skip:</label>
        <input id="skip" type="number" value="0" />
    </div>

    <button id="runBtn">Run Query</button>

    <div id="urlPreview"></div>

    <table>
        <thead id="tableHead"></thead>
        <tbody id="results"></tbody>
    </table>

    <script>
        const defaults = {
            Employees: {
                filter: "Salary ge 70000",
                select: "Name,Email,Salary",
                orderby: "Salary desc",
                top: "5",
                skip: "0"
            },
            Products: {
                filter: "Price ge 1000",
                select: "Name,Price",
                orderby: "Price desc",
                top: "5",
                skip: "0"
            },
            Branches: {
                filter: "City ne null",
                select: "Name,City",
                orderby: "Name asc",
                top: "10",
                skip: "0"
            }
        };

        const entitySelect = document.getElementById("entity");
        const filterInput = document.getElementById("filter");
        const selectInput = document.getElementById("select");
        const orderbyInput = document.getElementById("orderby");
        const topInput = document.getElementById("top");
        const skipInput = document.getElementById("skip");

        function applyDefaultsForEntity(entity) {
            const d = defaults[entity];
            filterInput.value = d.filter;
            selectInput.value = d.select;
            orderbyInput.value = d.orderby;
            topInput.value = d.top;
            skipInput.value = d.skip;
        }

        entitySelect.addEventListener("change", () => {
            applyDefaultsForEntity(entitySelect.value);
            buildUrlAndRun();
        });

        function buildUrl() {
            const entity = entitySelect.value;
            const base = `http://localhost:5197/odata/${entity}`;

            const params = new URLSearchParams();

            const filter = filterInput.value.trim();
            const select = selectInput.value.trim();
            const orderby = orderbyInput.value.trim();
            const top = topInput.value.trim();
            const skip = skipInput.value.trim();

            if (filter) params.append("$filter", filter);
            if (select) params.append("$select", select);
            if (entity === "Employees") {
                params.append("$expand", "Branch($select=Name)");
            }
            if (orderby) params.append("$orderby", orderby);
            if (top) params.append("$top", top);
            if (skip) params.append("$skip", skip);

            const query = params.toString();
            return query ? `${base}?${query}` : base;
        }

        function showUrl(url) {
            document.getElementById("urlPreview").textContent = url;
        }

        function getCellValue(item, key) {
            if (item == null || item[key] == null) return "";
            const value = item[key];

            if (typeof value === "object") {
                if (value.Name) return value.Name;
                if (value.City) return value.City;
                if (value.Email) return value.Email;
                return JSON.stringify(value);
            }

            return value;
        }

        function renderTable(items) {
            const tableHead = document.getElementById("tableHead");
            const results = document.getElementById("results");

            if (!items.length) {
                tableHead.innerHTML = "";
                results.innerHTML = "<tr><td colspan='3'>No records found</td></tr>";
                return;
            }

            const keys = Object.keys(items[0]).filter(k => k !== "$type");
            tableHead.innerHTML = `
            <tr>
              ${keys.map(k => `<th>${k === "Branch" ? "Branch Name" : k}</th>`).join("")}
            </tr>
          `;

            results.innerHTML = items.map(item => {
                return `<tr>${keys.map(k => `<td>${getCellValue(item, k)}</td>`).join("")}</tr>`;
            }).join("");
        }

        async function loadData() {
            const url = buildUrl();
            showUrl(url);

            try {
                const response = await fetch(url, {
                    headers: { "Accept": "application/json" }
                });

                if (!response.ok) {
                    const responseText = await response.text();
                    let errorMessage = `HTTP ${response.status}`;

                    try {
                        const errorData = JSON.parse(responseText);
                        errorMessage = errorData.error?.message || errorMessage;
                    } catch {
                        if (responseText.trim()) {
                            errorMessage = responseText;
                        }
                    }

                    throw new Error(errorMessage);
                }

                const data = await response.json();
                const items = Array.isArray(data.value) ? data.value : [];

                renderTable(items);
            } catch (err) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");
                cell.colSpan = 3;
                cell.textContent = `Error: ${err.message}`;
                row.appendChild(cell);
                document.getElementById("tableHead").replaceChildren();
                document.getElementById("results").replaceChildren(row);
            }
        }

        document.getElementById("runBtn").addEventListener("click", loadData);

        applyDefaultsForEntity(entitySelect.value);
        buildUrlAndRun();

        function buildUrlAndRun() {
            const url = buildUrl();
            showUrl(url);
            loadData();
        }
    </script>
</body>
</html>
